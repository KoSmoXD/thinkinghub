name: Zinc Hub checks
on:
  push:
  pull_request:

jobs:
  lua-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          luac5.4 -p loader.lua
          luac5.4 -p rooms_revisited.lua
          luac5.4 -p doors_mayhem.lua
          luac5.4 -p lib/ZincAdapter.lua
          luac5.4 -p lib/ZincUI.lua
          luac5.4 -p tests/smoke.lua
          luac5.4 -p tests/mayhem_dispatch.lua
          luac5.4 -p tests/mayhem_fragments.lua
          luac5.4 -p tests/mayhem_guard.lua
          luac5.4 -p lib/MayhemObsidian.lua
          luac5.4 -p tests/mayhem_ui.lua
          luac5.4 -p tests/mayhem_msesp.lua
          luac5.4 -p lib/MayhemStamina.lua
          luac5.4 -p tests/mayhem_stamina.lua
          luac5.4 -p lib/MayhemEntityAuto.lua
          luac5.4 -p tests/mayhem_entities.lua
          luac5.4 -p tests/mayhem_player_esp.lua
      - name: Hub mocked regression tests
        run: |
          lua5.4 tests/smoke.lua
          lua5.4 tests/mayhem_dispatch.lua
          lua5.4 tests/mayhem_fragments.lua
          lua5.4 tests/mayhem_guard.lua
          lua5.4 tests/mayhem_ui.lua
          lua5.4 tests/mayhem_msesp.lua
          lua5.4 tests/mayhem_stamina.lua
          lua5.4 tests/mayhem_entities.lua
          lua5.4 tests/mayhem_player_esp.lua
